<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b0f08" />
  <title>TWdbUP · Database The West</title>
  <style>
    :root {
      --gold-strong: #ffd878;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 30%, #3a2012 0, #1c0f09 48%, #0d0704 100%);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }
    .home {
      position: relative;
      width: min(100vw, 1536px);
      aspect-ratio: 1536 / 1024;
      margin: 0 auto;
      background: #1a0d07;
      box-shadow: 0 0 60px rgba(0,0,0,.75);
      user-select: none;
    }
    .home > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow .14s ease, background .14s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(255,205,100,.055);
      box-shadow:
        inset 0 0 0 3px rgba(255,216,120,.97),
        inset 0 0 14px rgba(255,195,70,.22),
        0 0 16px rgba(255,195,70,.60);
      outline: none;
    }

    /* Coordinate misurate sull'immagine originale 1536 x 1024. */
    .copricapi { left:13.5417%; top:40.6250%; width:11.5885%; height:16.3086%; }
    .collane   { left:25.8464%; top:40.6250%; width:11.5885%; height:16.3086%; }
    .abiti     { left:38.2161%; top:40.6250%; width:10.9375%; height:16.3086%; }
    .cinture   { left:50.5859%; top:40.6250%; width:11.3932%; height:16.3086%; }
    .pantaloni { left:62.9557%; top:40.6250%; width:11.5885%; height:16.3086%; }
    .scarpe    { left:75.3255%; top:40.6250%; width:11.5234%; height:16.3086%; }

    .armi-fuoco      { left:25.7161%; top:58.1055%; width:15.6250%; height:14.6484%; }
    .armi-contusione { left:42.1875%; top:58.1055%; width:15.7552%; height:14.6484%; }
    .fucili          { left:58.6589%; top:58.1055%; width:16.2109%; height:14.6484%; }

    .animali  { left:34.8958%; top:73.9258%; width:14.5182%; height:16.6016%; }
    .prodotti { left:50.5859%; top:73.9258%; width:14.6484%; height:16.6016%; }

    .mobile-menu {
      display: none;
      width: min(94vw,720px);
      margin: 18px auto 28px;
      padding: 14px;
      gap: 10px;
      grid-template-columns: repeat(2,minmax(0,1fr));
    }
    .mobile-menu a {
      color:#f7e3b4;
      background:linear-gradient(#4b2b17,#2f190d);
      border:1px solid #b98532;
      border-radius:9px;
      padding:12px 10px;
      text-align:center;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 3px 8px rgba(0,0,0,.35);
    }
    .mobile-menu a:hover,
    .mobile-menu a:focus-visible {
      outline:2px solid var(--gold-strong);
      outline-offset:2px;
    }
    @media (max-width:760px) {
      body { display:block; }
      .home { width:100vw; }
      .hotspot { border-radius:4px; }
      .mobile-menu { display:grid; }
    }
    @media (max-width:430px) {
      .mobile-menu { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="home" aria-label="TWdbUP - Database aggiornato e migliorato di The West">
      <img src="assets/home_twdbup.png" alt="TWdbUP, database di The West in un saloon western" />

      <a class="hotspot copricapi" href="copricapi/" aria-label="Apri Copricapi" title="Copricapi"></a>
      <a class="hotspot collane" href="collane/" aria-label="Apri Collane" title="Collane"></a>
      <a class="hotspot abiti" href="abiti/" aria-label="Apri Abiti" title="Abiti"></a>
      <a class="hotspot cinture" href="cinture/" aria-label="Apri Cinture" title="Cinture"></a>
      <a class="hotspot pantaloni" href="pantaloni/" aria-label="Apri Pantaloni" title="Pantaloni"></a>
      <a class="hotspot scarpe" href="scarpe/" aria-label="Apri Scarpe" title="Scarpe"></a>
      <a class="hotspot armi-fuoco" href="armi_fuoco/" aria-label="Apri Armi fuoco" title="Armi fuoco"></a>
      <a class="hotspot armi-contusione" href="armi_contusione/" aria-label="Apri Armi contusione" title="Armi contusione"></a>
      <a class="hotspot fucili" href="fucili/" aria-label="Apri Fucili" title="Fucili"></a>
      <a class="hotspot animali" href="animali/" aria-label="Apri Animali" title="Animali"></a>
      <a class="hotspot prodotti" href="prodotti/" aria-label="Apri Prodotti" title="Prodotti"></a>
    </section>

    <nav class="mobile-menu" aria-label="Categorie TWdbUP per schermi piccoli">
      <a href="copricapi/">Copricapi</a><a href="collane/">Collane</a>
      <a href="abiti/">Abiti</a><a href="cinture/">Cinture</a>
      <a href="pantaloni/">Pantaloni</a><a href="scarpe/">Scarpe</a>
      <a href="armi_fuoco/">Armi fuoco</a><a href="armi_contusione/">Armi contusione</a>
      <a href="fucili/">Fucili</a><a href="animali/">Animali</a>
      <a href="prodotti/">Prodotti</a>
    </nav>
  </main>
</body>
</html>
