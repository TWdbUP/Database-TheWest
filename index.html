<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b0f08" />
  <title>TWdbUP · Database The West</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#120905}
    body{font-family:Georgia,"Times New Roman",serif;color:#f5ddb0}
    .home-wrap{
      position:relative;
      width:min(100vw,1536px);
      aspect-ratio:1536/1024;
      margin:0 auto;
      background:#120905;
      box-shadow:0 0 60px rgba(0,0,0,.72);
    }
    .home-wrap>img{
      display:block;
      width:100%;height:100%;
      object-fit:contain;
      user-select:none;
      pointer-events:none;
    }
    .hotspot{
      position:absolute;
      display:block;
      border-radius:10px;
      background:transparent;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }
    /* Nessun overlay visivo: l'immagine approvata resta intatta. */
    .hotspot:focus-visible{
      box-shadow:inset 0 0 0 4px #ffd878,0 0 18px rgba(255,199,70,.72);
    }

    /* Coordinate sull'immagine approvata 1536x1024. */
    .copricapi {left:13.54%;top:40.63%;width:11.65%;height:16.21%}
    .collane   {left:25.85%;top:40.63%;width:11.59%;height:16.21%}
    .abiti     {left:38.28%;top:40.63%;width:10.94%;height:16.21%}
    .cinture   {left:50.59%;top:40.63%;width:11.39%;height:16.21%}
    .pantaloni {left:62.96%;top:40.63%;width:11.59%;height:16.21%}
    .scarpe    {left:75.39%;top:40.63%;width:11.46%;height:16.21%}

    .armi-fuoco      {left:25.65%;top:58.11%;width:15.76%;height:14.65%}
    .armi-contusione {left:42.19%;top:58.11%;width:15.76%;height:14.65%}
    .fucili          {left:58.79%;top:58.11%;width:16.21%;height:14.65%}

    .animali  {left:26.50%;top:73.93%;width:15.05%;height:16.70%}
    .prodotti {left:42.25%;top:73.93%;width:15.05%;height:16.70%}
    .set      {left:58.20%;top:73.93%;width:15.05%;height:16.70%}

    .mobile-nav{display:none;margin:14px auto 28px;padding:12px;width:min(94vw,720px);gap:9px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .mobile-nav a{color:#f7e3b4;background:linear-gradient(#4b2b17,#2f190d);border:1px solid #b98532;border-radius:9px;padding:11px 8px;text-align:center;text-decoration:none;font-weight:700}
    @media(max-width:760px){
      .mobile-nav{display:grid}
    }
    @media(max-width:430px){.mobile-nav{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <section class="home-wrap" aria-label="TWdbUP - Database aggiornato e migliorato di The West">
      <img src="assets/home_approvata_20261007.png" alt="TWdbUP, database di The West in un saloon western" />

      <a class="hotspot copricapi" href="copricapi/" aria-label="Apri Copricapi" title="Copricapi"></a>
      <a class="hotspot collane" href="collane/" aria-label="Apri Collane" title="Collane"></a>
      <a class="hotspot abiti" href="abiti/" aria-label="Apri Abiti" title="Abiti"></a>
      <a class="hotspot cinture" href="cinture/" aria-label="Apri Cinture" title="Cinture"></a>
      <a class="hotspot pantaloni" href="pantaloni/" aria-label="Apri Pantaloni" title="Pantaloni"></a>
      <a class="hotspot scarpe" href="scarpe/" aria-label="Apri Scarpe" title="Scarpe"></a>
      <a class="hotspot armi-fuoco" href="armi_fuoco/" aria-label="Apri Armi fuoco" title="Armi fuoco"></a>
      <a class="hotspot armi-contusione" href="armi_contusione/" aria-label="Apri Armi contusione" title="Armi contusione"></a>
      <a class="hotspot fucili" href="fucili/" aria-label="Apri Fucili" title="Fucili"></a>
      <a class="hotspot animali" href="animali/" aria-label="Apri Animali" title="Animali"></a>
      <a class="hotspot prodotti" href="prodotti/" aria-label="Apri Prodotti" title="Prodotti"></a>
      <a class="hotspot set" href="set/" aria-label="Apri SET" title="SET"></a>
    </section>

    <nav class="mobile-nav" aria-label="Categorie TWdbUP per schermi piccoli">
      <a href="copricapi/">Copricapi</a><a href="collane/">Collane</a>
      <a href="abiti/">Abiti</a><a href="cinture/">Cinture</a>
      <a href="pantaloni/">Pantaloni</a><a href="scarpe/">Scarpe</a>
      <a href="armi_fuoco/">Armi fuoco</a><a href="armi_contusione/">Armi contusione</a>
      <a href="fucili/">Fucili</a><a href="animali/">Animali</a>
      <a href="prodotti/">Prodotti</a><a href="set/">SET</a>
    </nav>
  </main>
</body>
</html>
