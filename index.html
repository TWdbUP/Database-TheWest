<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWdbUP — Database The West</title>
<style>
:root{--oro:#e9b46a;--oro-chiaro:#ffe0a1;--legenda:#f9e9c9;--fondo-etichetta:rgba(37,18,6,.91)}
*{box-sizing:border-box}
html{background:#110906}body{margin:0;color:var(--legenda);font-family:Georgia,'Times New Roman',serif}
/* IMMAGINE APPROVATA: non applicare filtri, maschere, crop o sovrapposizioni grafiche.
   Il logo e il sottotitolo esistono GIA' in questa immagine: NON ricrearli in HTML. */
.site-scene{position:relative;margin:0 auto;width:min(100%,1469px);aspect-ratio:1469/1071;overflow:hidden;}
.stage{position:absolute;left:0;top:0;width:1469px;height:1071px;transform-origin:top left;}
.stage>.bg{position:absolute;inset:0;width:1469px;height:1071px;object-fit:contain;user-select:none;pointer-events:none;z-index:0;}
/* Le cinque cornici sono elementi HTML totalmente separati dal PNG. */
.frames{position:absolute;z-index:2;left:344px;top:342px;width:800px;display:grid;grid-template-columns:324px 302px 150px;gap:12px;align-items:start;}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{min-width:0;min-height:0;position:relative;padding:11px 9px 9px;border:1.5px solid rgba(232,176,87,.88);border-radius:9px;background:transparent;box-shadow:0 0 0 1px rgba(33,10,2,.4),inset 0 0 0 1px rgba(250,219,147,.11)}
.frame-title{margin:0 0 11px;text-align:center;color:#ffe7ac;font:bold 17px/1.15 Georgia,'Times New Roman',serif;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 2px 4px #180700,0 0 7px #180700}
.tiles{display:grid;gap:8px}.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.one{grid-template-columns:1fr}
.tile{height:122px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:4px;text-decoration:none;color:var(--legenda);border:1px solid rgba(230,172,88,.44);border-radius:6px;background:rgba(16,7,2,.13);padding:5px 4px 4px;transition:background .12s,outline-color .12s,transform .12s}
.tile:hover,.tile:focus-visible{background:rgba(67,31,12,.48);transform:translateY(-2px);outline:2px solid #ffd28a;outline-offset:1px;}
.tile img{width:100%;height:88px;object-fit:contain;display:block;pointer-events:none;}
.tile .icon-pad{display:flex;align-items:center;justify-content:center;height:88px;border:1px solid rgba(230,172,88,.44);border-radius:5px;background:rgba(54,30,13,.82);box-shadow:inset 0 0 0 1px rgba(245,214,153,.12);padding:6px;}
.tile .icon-pad img{height:100%;width:100%;object-fit:contain;}
.tile .town-icon-pad{display:flex;align-items:center;justify-content:center;height:88px;border:1px solid rgba(230,172,88,.44);border-radius:5px;background:rgba(54,30,13,.88);box-shadow:inset 0 0 0 1px rgba(245,214,153,.12);padding:8px;position:relative;overflow:hidden;}
.tile .town-icon-pad::before{content:'🏘️';font-size:44px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));}
.tile .town-icon-pad::after{content:'NEGOZI';position:absolute;bottom:4px;left:6px;right:6px;text-align:center;font:bold 11px/1 Georgia,'Times New Roman',serif;color:#f5ddb1;letter-spacing:.8px;text-shadow:0 1px 2px #000;}
.tile .label{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:22px;text-align:center;background:var(--fondo-etichetta);border:1px solid rgba(235,173,76,.52);border-radius:3px;font:bold 12px/1.02 Georgia,'Times New Roman',serif;color:#fff0ce;text-shadow:0 1px #000;}
/* Nessuna immagine è ridisegnata, spostata al suo interno o alterata. */
[id^="abbigliamento-"] .tile{height:141px}[id^="abbigliamento-"] .tile img{height:105px}
[id^="cavalcatura-"] .tile{height:107px}[id^="cavalcatura-"] .tile img{height:76px}
[id^="armi-"] .tile{height:92px}[id^="armi-"] .tile img{height:61px}[id^="armi-"] .tile .label{min-height:25px;font-size:10px}
[id^="archivio-"] .tile{height:98px}[id^="archivio-"] .tile img{height:67px}
[id^="strumenti-"] .tile{height:130px}[id^="strumenti-"] .tile .city-icon{font-size:59px;line-height:1;display:grid;place-items:center;flex:1;text-shadow:0 3px 3px #0007}
[id^="strumenti-"] .tile .label{font-size:13px}[id^="strumenti-"] .frame-title{font-size:15px;letter-spacing:0}
.notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;background:#2d170b;border:1px solid #d2a15c;box-shadow:0 6px 25px #000a;color:#ffe2ae;padding:12px 18px;border-radius:8px;max-width:min(92vw,450px);text-align:center;font-size:14px;display:none;}
.extra-frames{max-width:1020px;padding:0 18px;margin:15px auto 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.extra-frames:empty{display:none}
.mobile-frames{display:none}
@media(max-width:760px){
 .site-scene{max-width:100%}.frames{display:none}
 .mobile-frames{display:grid;gap:12px;max-width:520px;padding:14px;margin:0 auto;grid-template-columns:1fr}
 .mobile-frames .frame{border:1px solid #dbad68;padding:12px;background:rgba(36,17,8,.94)}
 .mobile-frames .tile{min-height:90px;height:105px!important}.mobile-frames .tile img{height:74px!important}
 .mobile-frames .stack{gap:12px}.mobile-frames .frame-title{margin-bottom:11px}
 .mobile-frames .tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
 .mobile-frames .tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* LAB 06: only the saddle image gets an opaque brown panel, just like Animali. */
[id^="cavalcatura-"] .tile .icon-pad {
  display:flex; align-items:center; justify-content:center;
  height:76px; width:100%; flex:0 0 76px; padding:0;
  background:linear-gradient(145deg,#784322 0%,#482614 55%,#291409 100%);
  border:1px solid rgba(196,119,53,.66);
  border-radius:5px;
  box-shadow:inset 0 1px 0 rgba(255,224,160,.12), inset 0 0 12px rgba(0,0,0,.24);
}
[id^="cavalcatura-"] .tile .icon-pad img{
  width:76px; height:74px; object-fit:contain; padding:0; background:transparent; border:0;
}
/* LAB 06: the Western emporium icon is an image, not a cartoon emoji. */
[id^="strumenti-"] .tile img{
  height:88px; width:100%; max-width:100%;
  object-fit:contain; border-radius:4px;
}

/* LAB 06 — Strumenti si estende verso il basso quando si aggiungono icone.
   Il titolo resta visibile. Oltre lo spazio disponibile nel saloon, solo
   la lista di Strumenti scorre; nessun'altra cornice viene spostata. */
#strumenti-desktop {
  display: flex;
  flex-direction: column;
  max-height: calc(1071px - 342px - 30px);
}
#strumenti-desktop .tiles {
  min-height: 0;
  grid-auto-rows: max-content;
  align-content: start;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #bd884d rgba(25,12,5,.4);
}
/* Nella versione mobile non c'è limite di altezza: tutte le icone restano visibili. */
#strumenti-mobile { max-height: none; }
#strumenti-mobile .tiles { overflow: visible; }
</style>
</head>

const DESTS={clothes:'col-clothes',center:'col-center',tools:'col-tools'};
function frame(data,unique){
 const section=document.createElement('section');section.className='frame';section.id=data.id+'-'+unique;
 const h=document.createElement('h2');h.className='frame-title';h.textContent=data.title;section.appendChild(h);
 const tiles=document.createElement('div');tiles.className='tiles '+data.shape;
 for(const [name,icon,href] of data.items){
  const a=document.createElement('a');a.className='tile';a.href=href;a.title='Apri '+name;
  if(icon.endsWith('.png')){
    const img=document.createElement('img');img.src=ICON_DATA[icon]||'assets/'+icon;img.alt='';img.loading='eager';
    if(icon==='selle.png'){const pad=document.createElement('div');pad.className='icon-pad';pad.appendChild(img);a.appendChild(pad);}
    else{a.appendChild(img);}
  }
  else{const em=document.createElement('div');em.className='town-icon-pad';em.setAttribute('aria-hidden','true');a.appendChild(em)}
  const label=document.createElement('span');label.className='label';label.textContent=name;a.appendChild(label);
  tiles.appendChild(a);
 }
 section.appendChild(tiles);return section;
}
for(const f of FRAMES){document.getElementById(DESTS[f.col]).appendChild(frame(f,'desktop'));document.getElementById('mobile-frames').appendChild(frame(f,'mobile'))}
for(const f of EXTRA_FRAMES)document.getElementById('extra-frames').appendChild(frame(f,'extra'));
function resize(){const scale=document.getElementById('scene').clientWidth/1469;document.getElementById('stage').style.transform=`scale(${scale})`}
window.addEventListener('resize',resize,{passive:true});resize();
// Nell'anteprima locale i link sono visibili ma le pagine vere non sono incluse nel pacchetto.
document.addEventListener('click',e=>{const link=e.target.closest('a.tile');if(!link)return;if(location.protocol!=='file:')return;const h=link.getAttribute('href');if(h==='negozi/'||h==='inventari/')return;e.preventDefault();const box=document.getElementById('notice');box.textContent=`${link.title}: il collegamento ${link.getAttribute('href')} si attiverà quando questa Home sarà nella cartella principale del sito.`;box.style.display='block';setTimeout(()=>box.style.display='none',4800)});
</script>
